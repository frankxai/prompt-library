openapi: 3.0.0
info:
  title: Prompt Library API
  version: 1.0.0
  description: A community API v0 for the prompt-library, available via raw.githubusercontent.com static JSON files.
servers:
  - url: https://raw.githubusercontent.com/frankxai/prompt-library/main/dist
paths:
  /index.json:
    get:
      summary: Get all prompts
      operationId: getPrompts
      responses:
        '200':
          description: A list of all available prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prompt'
  /categories.json:
    get:
      summary: Get all categories
      operationId: getCategories
      responses:
        '200':
          description: A list of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /prompts/{id}.json:
    get:
      summary: Get a specific prompt by ID
      operationId: getPromptById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The prompt details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prompt'
components:
  schemas:
    Prompt:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        model_targets:
          type: array
          items:
            type: string
        license:
          type: string
        path:
          type: string
